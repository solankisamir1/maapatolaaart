<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAA Patola - Admin Control</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f6f8; margin: 0; padding: 14px; }
    .card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    h2, h3 { margin-top: 0; color: #7a1c2d; }
    label { font-size: 13px; font-weight: 600; color: #333; display: block; margin-top: 12px; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
    button { background: #7a1c2d; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 16px; }
    .btn-delete { background: #d93025; padding: 6px 12px; font-size: 13px; width: auto; margin-top: 0; border-radius: 6px; }
    .filter-tabs { display: flex; overflow-x: auto; gap: 8px; margin: 10px 0 15px 0; padding-bottom: 5px; }
    .tab-btn { width: auto; padding: 8px 12px; font-size: 13px; background: #e0e0e0; color: #333; border-radius: 20px; white-space: nowrap; margin-top: 0; }
    .tab-btn.active { background: #7a1c2d; color: #fff; }
    .item-card { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .item-card img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; margin-right: 12px; }
    .item-details { flex-grow: 1; }
    .category-tag { display: inline-block; background: #eee; font-size: 11px; padding: 2px 6px; border-radius: 4px; color: #555; }
    .loader { display: none; text-align: center; color: #7a1c2d; font-weight: bold; margin: 10px 0; }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</head>
<body>

  <!-- Login Section -->
  <div id="loginBox" class="card">
    <h2>Admin Login</h2>
    <input type="email" id="email" placeholder="Admin Email ID">
    <input type="password" id="password" placeholder="Password">
    <button onclick="adminLogin()">Login</button>
  </div>

  <!-- Dashboard Section -->
  <div id="dashBox" class="card" style="display:none;">
    <h2>Naya Item Add Karo</h2>
    
    <label>Product Category Chuno:</label>
    <select id="pCategory">
      <option value="double-ikkat">Double Ikat Patola</option>
      <option value="single-ikkat">Single Ikat Patola</option>
      <option value="rajkoti">Rajkoti Patola</option>
      <option value="sarees">All Sarees Collection</option>
      <option value="dupatta">Dupatta</option>
      <option value="clutches">Clutches & Accessories</option>
    </select>

    <label>Title / Design Code:</label>
    <input type="text" id="pName" placeholder="e.g. Navratna Double Ikat / Red Floral">

    <label>Price (₹):</label>
    <input type="number" id="pPrice" placeholder="e.g. 25000">
    <label>Original / Old Price (₹) (Optional - Discount ke liye):</label>
<input type="number" id="pOldPrice" placeholder="e.g. 30000">

<label style="display: flex; align-items: center; gap: 8px; margin: 10px 0; cursor: pointer;">
  <input type="checkbox" id="pInStock" checked style="width: auto;">
  <span>In Stock (Tick hataoge toh Out of Stock mark hoga)</span>
</label>

    <label>Photo (Camera ya Gallery se):</label>
    <input type="file" id="pImage" accept="image/*">

    <div id="loading" class="loader">Uploading... Please wait!</div>
    <button id="submitBtn" onclick="uploadProduct()">Upload to Website</button>

    <h3 style="margin-top: 30px;">Manage Live Items</h3>
    
    <!-- Filter items by category to delete easily -->
    <div class="filter-tabs">
      <button class="tab-btn active" onclick="filterItems('all', this)">All</button>
      <button class="tab-btn" onclick="filterItems('double-ikkat', this)">Double Ikat</button>
      <button class="tab-btn" onclick="filterItems('single-ikkat', this)">Single Ikat</button>
      <button class="tab-btn" onclick="filterItems('rajkoti', this)">Rajkoti</button>
      <button class="tab-btn" onclick="filterItems('dupatta', this)">Dupatta</button>
      <button class="tab-btn" onclick="filterItems('clutches', this)">Clutches</button>
    </div>

    <div id="itemsList"></div>
    
    <button onclick="firebase.auth().signOut()" style="background:#555; margin-top: 25px;">Logout</button>
  </div>
  <!-- Edit Product Popup Modal -->
<div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; padding: 20px;">
  <div style="background: #fff; width: 100%; max-width: 450px; padding: 25px; border-radius: 10px; max-height: 90vh; overflow-y: auto; color: #333;">
    <h3 style="margin-bottom: 15px;">Edit Product</h3>
    <input type="hidden" id="editDocId">
    
    <label style="display: block; margin-top: 10px;">Title / Design Code</label>
    <input type="text" id="editTitle" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
    
    <label style="display: block; margin-top: 10px;">Selling Price (₹)</label>
    <input type="number" id="editPrice" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
    
    <label style="display: block; margin-top: 10px;">Original / Old Price (₹)</label>
    <input type="number" id="editOldPrice" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
    
    <label style="display: block; margin-top: 10px;">Category</label>
    <select id="editCategory" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
      <option value="Double Ikat Patola">Double Ikat Patola</option>
      <option value="Single Ikat Patola">Single Ikat Patola</option>
      <option value="Rajkoti Patola">Rajkoti Patola</option>
      <option value="Dupatta">Dupatta</option>
      <option value="Clutches">Clutches</option>
    </select>

    <label style="display: flex; align-items: center; gap: 8px; margin: 15px 0; cursor: pointer;">
      <input type="checkbox" id="editInStock" style="width: auto;">
      <span>In Stock (Uncheck karne par 'Out of Stock' dikhega)</span>
    </label>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button onclick="saveProductEdit()" style="flex: 1; padding: 10px; background: #28a745; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Save Changes</button>
      <button onclick="closeEditModal()" style="flex: 1; padding: 10px; background: #6c757d; color: #fff; border: none; border-radius: 5px; cursor: pointer;">Cancel</button>
    </div>
  </div>
</div>

  <script src="admin.js"></script>
</body>
</html>
